<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>콘텐츠 반응형 검증</title><style>body{margin:0;background:#181a24;color:white;font:14px sans-serif}nav{padding:12px;display:flex;gap:14px;align-items:center;position:sticky;top:0;background:#181a24;z-index:10}select,button{padding:8px}iframe{display:block;box-sizing:border-box;margin:0 auto;border:1px solid #555;height:850px;width:393px}</style></head><body><nav><label>페이지 <select id="page">
<option value="/">홈</option><option value="/guide">가이드 목록</option>
<option value="/salary">연봉</option><option value="/severance">퇴직금</option><option value="/mortgage">대출</option><option value="/savings">적금</option><option value="/jeonse">전월세</option><option value="/lotto">로또</option>
<option value="/guide/2026-salary-tax-guide">연봉 가이드</option><option value="/guide/dsr-stress-test-2026">DSR 가이드</option><option value="/guide/severance-calculation-guide">퇴직금 가이드</option><option value="/guide/isa-vs-regular-savings">ISA 가이드</option><option value="/guide/jeonse-safety-2026">전세 가이드</option><option value="/guide/lotto-tax-guide">로또 가이드</option>

</select></label><label>화면 너비 <select id="width"><option>320</option><option selected>393</option><option>768</option><option>1280</option></select></label><button data-go="top">맨 위</button><button data-go="examples-heading">예시</button><button data-go="faq-heading">FAQ</button><button data-go="official-sources-heading">출처</button></nav><iframe title="검증 페이지" id="view" src="/"></iframe><script>
const frame=document.querySelector('#view');document.querySelector('#page').addEventListener('change',e=>{frame.src=e.target.value});document.querySelector('#width').addEventListener('change',e=>{frame.style.width=e.target.value+'px'});for(const button of document.querySelectorAll('button'))button.addEventListener('click',()=>{const id=button.dataset.go;if(id==='top'){frame.contentWindow.scrollTo(0,0);return}frame.contentDocument.getElementById(id)?.scrollIntoView({block:'center'});});
</script></body></html>
